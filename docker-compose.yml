# Local one-command stack. The reference build runs fully in-memory, so only the
# app service is required. Postgres / Neo4j / Qdrant / Redis are included as the
# documented production datastores (commented in) — see docs/DATABASE_SCHEMA.md.
services:
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - SEED_ON_START=1
      - CORS_ORIGINS=*
    restart: unless-stopped

